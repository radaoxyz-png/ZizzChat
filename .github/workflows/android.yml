name: ZizzChat Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: Build Debug APK
        env:
          ZEGO_APP_SIGN: ${{ secrets.ZEGO_APP_SIGN }}
        run: gradle assembleDebug -PZEGO_APP_SIGN="$ZEGO_APP_SIGN"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZizzChat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
